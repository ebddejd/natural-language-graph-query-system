apiVersion: v1
kind: ConfigMap
metadata: {name: journey-config}
data:
  PUBLIC_URL: http://localhost:10000
  REDIS_URL: redis://journey-redis:6379/0
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: journey-redis}
spec:
  replicas: 1
  selector: {matchLabels: {app: journey-redis}}
  template:
    metadata: {labels: {app: journey-redis}}
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{containerPort: 6379}]
---
apiVersion: v1
kind: Service
metadata: {name: journey-redis}
spec:
  selector: {app: journey-redis}
  ports: [{port: 6379}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: journey}
spec:
  replicas: 2
  selector: {matchLabels: {app: journey}}
  template:
    metadata: {labels: {app: journey}}
    spec:
      containers:
        - name: journey
          image: journey:ci
          imagePullPolicy: Never
          envFrom:
            - configMapRef: {name: journey-config}
            - secretRef: {name: journey-provider}
          ports: [{containerPort: 10000}]
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: '1', memory: 512Mi}
          livenessProbe:
            httpGet: {path: /healthz, port: 10000}
          readinessProbe:
            httpGet: {path: /readyz, port: 10000}
            timeoutSeconds: 20
---
apiVersion: v1
kind: Service
metadata: {name: journey}
spec:
  selector: {app: journey}
  ports: [{port: 10000}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: journey}
spec:
  minReplicas: 2
  maxReplicas: 4
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: journey}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
